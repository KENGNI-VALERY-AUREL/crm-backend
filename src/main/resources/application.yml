spring:
  application:
    name: crm-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:55432}/${DB_NAME:crm_db}
    username: ${DB_USER:crm_user}
    password: ${DB_PASSWORD:crm_password}

  jpa:
    # validate (not update/create): the schema is driven by Flyway, never by Hibernate.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8181}

management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-jwt-secret-key-before-deploying-to-any-real-environment}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
